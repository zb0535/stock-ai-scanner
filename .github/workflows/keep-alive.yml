name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render backend
        run: |
          URL="https://stock-ai-scanner-x0fd.onrender.com/api/watchlist"
          STATUS=$(curl -fsS --max-time 60 -o /dev/null -w '%{http_code}' "$URL")
          echo "HTTP status: $STATUS"
          test "$STATUS" = "200"
